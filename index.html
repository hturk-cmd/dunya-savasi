
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dünya Hâkimiyeti — Harita</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101722;
      color: #edf3ff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 14px 18px;
      background: #192536;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 20px; margin: 0; }
    #status { color: #aabbd2; font-size: 13px; margin-top: 5px; }
    .tools { display: flex; gap: 8px; }
    button {
      background: #2b3d55;
      color: white;
      border: 1px solid #526782;
      border-radius: 8px;
      padding: 9px 13px;
      cursor: pointer;
    }
    button:hover { background: #3c5575; }
    #map-wrap {
      height: calc(100vh - 76px);
      min-height: 400px;
      overflow: hidden;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: #111c2b;
      touch-action: none;
    }
    .region {
      fill: #30445d;
      stroke: #71839a;
      stroke-width: .45;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
    }
    .region:hover {
      fill: #e6b85c;
      stroke: #fff0bd;
      stroke-width: 1.2;
    }
    .region.selected { fill: #d6a644; }
    #info {
      position: absolute;
      bottom: 16px;
      left: 16px;
      padding: 10px 14px;
      background: #192536eF;
      border: 1px solid #40536d;
      border-radius: 9px;
      pointer-events: none;
      max-width: calc(100% - 32px);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🌍 Dünya Hâkimiyeti</h1>
      <div id="status">Harita yükleniyor...</div>
    </div>
    <div class="tools">
      <button id="zoom-in">＋ Yakınlaştır</button>
      <button id="zoom-out">－ Uzaklaştır</button>
      <button id="reset">Sıfırla</button>
    </div>
  </header>

  <main id="map-wrap">
    <svg id="map" viewBox="0 0 1200 650" aria-label="Dünya haritası">
      <rect width="1200" height="650" fill="#111c2b"></rect>
    </svg>
    <div id="info">Bir bölgeye tıkla.</div>
  </main>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const svg = d3.select("#map");
    const status = document.querySelector("#status");
    const info = document.querySelector("#info");
    const width = 1200;
    const height = 650;

    const layer = svg.append("g").attr("id", "regions-layer");
    const zoom = d3.zoom()
      .scaleExtent([1, 12])
      .on("zoom", event => layer.attr("transform", event.transform));

    svg.call(zoom);

    document.querySelector("#zoom-in").onclick =
      () => svg.transition().call(zoom.scaleBy, 1.4);
    document.querySelector("#zoom-out").onclick =
      () => svg.transition().call(zoom.scaleBy, 1 / 1.4);
    document.querySelector("#reset").onclick =
      () => svg.transition().call(zoom.transform, d3.zoomIdentity);

    async function loadMap() {
      try {
        status.textContent = "regions.geojson yükleniyor...";
        const response = await fetch("./regions.geojson");

        if (!response.ok) {
          throw new Error("regions.geojson bulunamadı (HTTP " + response.status + ")");
        }

        const data = await response.json();

        if (!data || data.type !== "FeatureCollection" ||
            !Array.isArray(data.features)) {
          throw new Error("GeoJSON, FeatureCollection biçiminde değil.");
        }

        const features = data.features.filter(feature =>
          feature &&
          feature.geometry &&
          ["Polygon", "MultiPolygon"].includes(feature.geometry.type)
        );

        if (!features.length) {
          throw new Error("Dosyada çizilebilecek bölge bulunamadı.");
        }

        const collection = {
          type: "FeatureCollection",
          features
        };

        status.textContent = features.length + " bölge bulundu, harita çiziliyor...";

        // Tüm dünyayı verinin sınırlarına göre kadraja sığdır.
        const projection = d3.geoNaturalEarth1()
          .fitExtent([[12, 12], [width - 12, height - 12]], collection);

        const path = d3.geoPath(projection);

        layer.selectAll("path")
          .data(features)
          .join("path")
          .attr("class", "region")
          .attr("d", feature => path(feature) || "")
          .on("click", (event, feature) => {
            event.stopPropagation();
            layer.selectAll(".region").classed("selected", false);
            d3.select(event.currentTarget).classed("selected", true);
            const name = feature.properties?.region_name || "İsimsiz bölge";
            const country = feature.properties?.country_code || "";
            info.textContent = country ? name + " (" + country + ")" : name;
          });

        const bounds = d3.geoBounds(collection);
        console.log("Toplam çizilen bölge:", features.length);
        console.log("Coğrafi sınırlar:", bounds);
        console.log("İlk bölgeler:", features.slice(0, 5).map(f => f.properties?.region_name));

        status.textContent = "Harita hazır — " + features.length + " bölge";
      } catch (error) {
        console.error(error);
        status.textContent = "Harita yüklenemedi: " + error.message;
      }
    }

    loadMap();
  </script>
</body>
</html>
