<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dünya Hâkimiyeti</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d30;--line:#2b3851;--text:#edf3ff;
--muted:#9baac2;--accent:#60a5fa;--red:#ef4444;--green:#22c55e;--gold:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{padding:10px 14px;border-bottom:1px solid var(--line);background:#10182a;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
h1{margin:0;font-size:18px}
h2{font-size:15px;margin:0 0 10px}
small,.muted{color:var(--muted)}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px;max-width:1600px;margin:0 auto}
@media(max-width:900px){
  main{grid-template-columns:1fr;padding:8px;gap:8px}
  #mapbox{height:50vh;min-height:280px}
  .panel{padding:10px;margin-bottom:8px}
  header{padding:8px 10px}h1{font-size:16px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
input,select,button{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0d1526;color:var(--text);margin:6px 0;font:inherit}
button{cursor:pointer;background:#2563eb;border-color:#3b82f6;font-weight:650;transition:filter 0.2s}
button:hover{filter:brightness(1.15)}
button.secondary{background:#27344b;border-color:#3b4962}
button.danger{background:#7f1d1d;border-color:#ef4444}
button.success{background:#166534;border-color:#22c55e}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}
.row>*{min-width:0;flex:1}
#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#93c5fd;margin-top:10px}
#mapbox{height:min(70vh,720px);min-height:380px;overflow:hidden;border-radius:12px;background:#0a1425;border:1px solid var(--line);position:relative}
#map{width:100%;height:100%;display:block;touch-action:none}
.region{stroke:#7c91ac;stroke-width:.4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .12s, fill-opacity .12s}
.region:hover{stroke:white;stroke-width:1.5}
.siege-label{pointer-events:none;font-weight:800;font-family:system-ui,sans-serif}
.map-tools{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.map-tools button{width:auto;min-width:42px;padding:8px 12px;flex:0 0 auto}
#players{display:grid;gap:6px}
.player{display:flex;gap:10px;align-items:center;padding:8px;background:#0d1526;border-radius:8px}
.player.turn{border:1px solid var(--gold);background:#1a2236}
.swatch{width:16px;height:16px;border-radius:4px;flex:0 0 16px;border:1px solid rgba(255,255,255,.3)}
#dice{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.badge.lobby{background:#1e3a8a}.badge.playing{background:#166534}
.badge.war{background:#7f1d1d}.badge.ended{background:#334155}
.war-banner{background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-weight:600}
.code-box{background:#0d1526;border:1px dashed #3b82f6;padding:14px;border-radius:10px;text-align:center;font-family:ui-monospace,monospace;font-size:24px;letter-spacing:6px;font-weight:800;color:#93c5fd;margin:10px 0;cursor:pointer;user-select:all}
.code-box small{display:block;font-size:11px;letter-spacing:normal;color:var(--muted);margin-top:4px;font-weight:400}
.toggle-plane{display:flex;gap:8px;margin:10px 0;align-items:center;padding:8px 12px;background:#0d1526;border-radius:8px;border:1px solid var(--line);cursor:pointer;user-select:none}
.toggle-plane.active{background:#7c2d12;border-color:#f59e0b;color:#fef3c7}
.toggle-plane input{margin:0;width:auto;padding:0}
.siege-info{font-size:12px;color:var(--gold);margin-top:4px}
.warn-banner{background:#78350f;color:#fef3c7;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;font-weight:600}
.online-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.4)}
.online-dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}
.online-dot.off{background:#ef4444}
.server-card{background:#0d1526;border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;display:flex;flex-direction:column;gap:4px}
.server-card button{padding:8px 12px;margin:4px 0 0 0}
</style>
</head>
<body>

<header>
  <div>
    <h1>🌍 Dünya Hâkimiyeti</h1>
    <small id="subTitle">Kur. Davet et. Hâkimiyet kur.</small>
  </div>
  <div id="userState" class="muted">Bağlantı kuruluyor…</div>
</header>

<main>
  <aside id="sidePanel"></aside>

  <section class="panel">
    <div class="row" style="align-items:center;margin-bottom:10px">
      <div>
        <h2 style="margin-bottom:3px">Dünya haritası</h2>
        <small id="mapStatus">Harita yükleniyor…</small>
      </div>
      <div style="text-align:right">
        <small id="regionCount">0 bölge</small>
      </div>
    </div>
    <div class="map-tools">
      <button id="zoomIn" class="secondary">＋</button>
      <button id="zoomOut" class="secondary">−</button>
      <button id="resetZoom" class="secondary">Sıfırla</button>
    </div>
    <div id="mapbox"><svg id="map" viewBox="0 0 960 560"></svg></div>
    <p class="muted" id="mapHint">Bir bölgeye tıklayarak hamleni kullan.</p>
    <div id="status" role="status"></div>
  </section>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

const SUPABASE_URL = "https://ycnhjtgrrhgwjbyhbfmh.supabase.co";
const SUPABASE_KEY = "sb_publishable_lzDd7QoBsJPCr8Fw1HDXMg_hPT7I_eG";

const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const $ = id => document.getElementById(id);
const ONLINE_THRESHOLD_MS = 90000;

let session = null;
let gameState = null;
let features = [];
let neighbors = new Map();
let ownership = new Map();
let sieges = new Map();
let planeMode = false;
let channel = null;
let zoomBehavior, mapLayer, mapProjection, mapPath;
let heartbeatTimer = null;
let pollTimer = null;

function msg(t){ $("status").textContent = t; }
function findPlayer(uid){ return gameState?.players?.find(p => p.user_id === uid); }
function iAmTurn(){ return gameState?.game?.current_turn_user_id === session?.user?.id; }
function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function isOnline(p){
  if (!p?.last_seen_at) return false;
  return (Date.now() - new Date(p.last_seen_at).getTime()) < ONLINE_THRESHOLD_MS;
}
function allOnline(){ return gameState?.players?.every(isOnline) ?? false; }
function curPhase(){
  if (!gameState) return "lobby";
  const s = gameState.game?.status;
  if (s === 'lobby' || s === 'ended' || s === 'rolling') return s;
  if (gameState.war) return "war";
  return s || "playing";
}

function myDiceLeft(){
  if (!gameState) return 0;
  const me = findPlayer(session.user.id);
  return me ? me.current_moves : 0;
}

// ---------- HEARTBEAT & POLLING ----------
function startHeartbeat(gameId){
  stopHeartbeat();
  const beat = () => {
    if (document.hidden) return;
    db.rpc("heartbeat", { p_game_id: gameId }).catch(()=>{});
  };
  beat();
  heartbeatTimer = setInterval(beat, 15000);
  document.addEventListener("visibilitychange", onVisChange);

  pollTimer = setInterval(() => {
    if (gameState && (gameState.game.status === 'lobby' || gameState.game.status === 'rolling' || gameState.war)) {
      refresh();
    }
  }, 3000);
}
function stopHeartbeat(){
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  document.removeEventListener("visibilitychange", onVisChange);
}
function onVisChange(){
  if (!document.hidden && gameState?.game?.id) {
    db.rpc("heartbeat", { p_game_id: gameState.game.id }).catch(()=>{});
    refresh();
  }
}

// ---------- AUTH ----------
async function signup(email, pw){
  const { data, error } = await db.auth.signUp({ email, password: pw });
  if (error) throw error;
  if (data.session) { session = data.session; afterLogin(); }
  else msg("Hesap oluşturuldu. Lütfen e-postanızı onaylayın.");
}
async function login(email, pw){
  const { data, error } = await db.auth.signInWithPassword({ email, password: pw });
  if (error) throw error;
  session = data.session; afterLogin();
}
async function logout(){
  await db.auth.signOut();
  session = null; gameState = null;
  stopHeartbeat();
  if (channel) { db.removeChannel(channel); channel = null; }
  renderAuth();
}
async function afterLogin(){
  $("userState").textContent = "Giriş yapıldı";
  renderMenu();
}

// ---------- MENÜ / LOBİ / OYUN ----------
function renderAuth(){
  $("sidePanel").innerHTML = `
    <section class="panel">
      <h2>Hesap</h2>
      <input id="email" type="email" placeholder="E-posta" autocomplete="email">
      <input id="password" type="password" placeholder="Şifre" autocomplete="current-password">
      <div class="row">
        <button id="signupBtn">Kayıt ol</button>
        <button id="loginBtn" class="secondary">Giriş yap</button>
      </div>
      <div id="authStatus" style="color:var(--red); font-size:13px; margin-top:10px; font-weight:bold;"></div>
    </section>`;

  $("signupBtn").onclick = () => withStatus(async () => {
    const email = $("email").value.trim(); const pw = $("password").value;
    if(!email || !pw) throw new Error("E-posta ve şifre gerekli");
    $("authStatus").textContent = "İşleniyor...";
    await signup(email, pw);
  });
  $("loginBtn").onclick = () => withStatus(async () => {
    const email = $("email").value.trim(); const pw = $("password").value;
    if(!email || !pw) throw new Error("E-posta ve şifre gerekli");
    $("authStatus").textContent = "Giriş yapılıyor...";
    await login(email, pw);
  });
}

async function renderMenu(){
  $("sidePanel").innerHTML = `
    <section class="panel">
      <h2>👤 Oyunlarınız</h2>
      <div id="myGames"><small class="muted">Yükleniyor…</small></div>
    </section>
    <section class="panel">
      <h2>🌐 Sunucu Listesi</h2>
      <div id="serverList"><small class="muted">Yükleniyor…</small></div>
    </section>
    <section class="panel">
      <h2>Oyun Kur</h2>
      <input id="newGameName" placeholder="Oyun adı">
      <input id="newGameMax" type="number" min="2" max="8" value="8" placeholder="Maks oyuncu">
      <label class="muted">Başlangıç Ülkesi</label>
      <select id="createCountry"><option value="">Harita yükleniyor…</option></select>
      <label class="muted">Renk</label>
      <input id="createColor" type="color" value="#3b82f6">
      <button id="createGameBtn">Yeni Oyun Kur</button>
    </section>
    <section class="panel">
      <h2>Kodla Katıl</h2>
      <input id="joinCode" placeholder="6 haneli kod" maxlength="6" inputmode="numeric">
      <input id="joinUsername" placeholder="Oyuncu adın" maxlength="24">
      <label class="muted">Başlangıç Ülkesi</label>
      <select id="joinCountry"><option value="">Harita yükleniyor…</option></select>
      <label class="muted">Renk</label>
      <input id="joinColor" type="color" value="#22c55e">
      <button id="joinGameBtn" class="success">Katıl</button>
    </section>
    <section class="panel">
      <button id="logoutBtn" class="secondary">Çıkış yap</button>
    </section>`;

  fillCountries();
  loadMenuLists();

  $("createGameBtn").onclick = () => withStatus(async () => {
    const name = $("newGameName").value.trim() || "Dünya Odası";
    const max = Math.max(2, Math.min(8, +$("newGameMax").value || 8));
    const country = $("createCountry").value;
    const color = $("createColor").value;
    if (!country) throw new Error("Lütfen bir başlangıç ülkesi seçin.");
    const { data, error } = await db.rpc("create_game", { p_name: name, p_max_players: max, p_country: country, p_color: color });
    if (error) throw error;
    await loadGameState(data.id); enterGame();
  });

  $("joinGameBtn").onclick = () => withStatus(async () => {
    const code = $("joinCode").value.trim();
    const uname = $("joinUsername").value.trim();
    const country = $("joinCountry").value;
    const color = $("joinColor").value;
    if (code.length !== 6) throw new Error("6 haneli kod gir.");
    if (uname.length < 2) throw new Error("Oyuncu adı çok kısa.");
    if (!country) throw new Error("Lütfen bir ülke seçin.");
    const { data, error } = await db.rpc("join_game_by_code", { p_code: code, p_country: country, p_color: color });
    if (error) throw error;
    await db.from("profiles").upsert({ id: session.user.id, username: uname });
    await loadGameState(data.id); enterGame();
  });
  $("logoutBtn").onclick = () => withStatus(logout);
}

async function loadMenuLists(){
  try {
    const { data: myGames, error: myErr } = await db.rpc("find_my_games");
    const box = $("myGames");
    if (myErr) throw myErr;
    if (!myGames || myGames.length === 0) {
      box.innerHTML = '<small class="muted">Aktif oyununuz yok.</small>';
    } else {
      box.innerHTML = myGames.map(g => `
        <div class="server-card">
          <div><strong>${escapeHTML(g.name)}</strong> <small style="margin-left:6px">${g.status === 'lobby' ? '🟢 Lobide' : '🔴 Oynanıyor'}</small></div>
          <small>${g.player_count}/${g.max_players} • Kod: ${g.code}</small>
          <button class="join-server-btn success" data-id="${g.id}">Devam Et</button>
        </div>
      `).join("");
      box.querySelectorAll(".join-server-btn").forEach(btn => {
        btn.onclick = () => withStatus(async () => {
          await loadGameState(btn.dataset.id); enterGame();
        });
      });
    }
  } catch(e) { $("myGames").innerHTML = '<small class="muted">Oyunlar yüklenemedi.</small>'; }

  try {
    const { data: pubGames, error: pubErr } = await db.rpc("list_games");
    const box = $("serverList");
    if (pubErr) throw pubErr;
    const myGameIds = new Set((await db.rpc("find_my_games")).data?.map(g => g.id) || []);
    const filtered = (pubGames || []).filter(g => !myGameIds.has(g.id));

    if (filtered.length === 0) {
      box.innerHTML = '<small class="muted">Katılabileceğiniz açık sunucu yok.</small>';
    } else {
      box.innerHTML = filtered.map(g => {
        const joinable = g.status === 'lobby' && g.player_count < g.max_players;
        return `
          <div class="server-card">
            <div><strong>${escapeHTML(g.name)}</strong></div>
            <small>${g.player_count}/${g.max_players} • ${escapeHTML(g.creator_name||'?')} • Kod: ${g.code}</small>
            ${joinable ? `<button class="success join-pub-btn" data-code="${g.code}">Katıl</button>` : `<small class="muted">Katılamazsın</small>`}
          </div>
        `;
      }).join("");
      box.querySelectorAll(".join-pub-btn").forEach(btn => {
        btn.onclick = () => {
          $("joinCode").value = btn.dataset.code;
          msg("Kodu doldurduk. Ülke ve renk seçip 'Katıl'a bas.");
          $("joinCode").scrollIntoView({behavior:"smooth", block:"center"});
        };
      });
    }
  } catch(e) { $("serverList").innerHTML = '<small class="muted">Sunucular yüklenemedi.</small>'; }
}

function fillCountries(){
  const sels = [$("joinCountry"), $("createCountry")];
  sels.forEach(sel => {
    if (!sel) return;
    sel.replaceChildren();
    if (features.length === 0) {
      sel.innerHTML = '<option value="">Harita yükleniyor...</option>';
      return;
    }
    const sorted = [...features].filter(f => f.properties.region_name).sort((a,b) => a.properties.region_name.localeCompare(b.properties.region_name));
    for (const f of sorted) {
      const o = document.createElement("option");
      o.value = f.properties.region_id;
      o.textContent = `${f.properties.region_name} (${f.properties.region_id})`;
      sel.append(o);
    }
  });
}

async function loadGameState(gameId){
  const { data, error } = await db.rpc("get_game_state", { p_game_id: gameId });
  if (error) throw error;
  gameState = data; syncOwnership();
}
function syncOwnership(){
  ownership.clear();
  for (const o of gameState.ownership) ownership.set(o.region_id, o);
  sieges.clear();
  if (gameState.sieges) { for (const s of gameState.sieges) sieges.set(s.region_id, s); }
}
function enterGame(){
  subscribeRealtime(); renderSidePanel(); repaintMap();
  startHeartbeat(gameState.game.id);
  $("subTitle").textContent = `${gameState.game.name} • Kod: ${gameState.game.code}`;
}

function subscribeRealtime(){
  if (channel) db.removeChannel(channel);
  channel = db.channel("game-" + gameState.game.id)
    .on("postgres_changes", { event:"*", schema:"public", table:"games", filter:`id=eq.${gameState.game.id}` }, refresh)
    .on("postgres_changes", { event:"*", schema:"public", table:"game_players", filter:`game_id=eq.${gameState.game.id}` }, refresh)
    .on("postgres_changes", { event:"*", schema:"public", table:"region_ownership", filter:`game_id=eq.${gameState.game.id}` }, refresh)
    .on("postgres_changes", { event:"*", schema:"public", table:"wars", filter:`game_id=eq.${gameState.game.id}` }, refresh)
    .on("postgres_changes", { event:"*", schema:"public", table:"region_sieges", filter:`game_id=eq.${gameState.game.id}` }, refresh)
    .subscribe();
}
async function refresh(){
  if (!gameState) return;
  await loadGameState(gameState.game.id); renderSidePanel(); repaintMap();
}

// ---------- KENAR PANEL ----------
function renderSidePanel(){
  if (!gameState) return renderMenu();
  const g = gameState.game;
  if (g.status === "lobby") return renderLobby();
  if (g.status === "ended") return renderEnded();
  if (g.status === "rolling") return renderRolling();
  if (gameState.war) return renderWar();
  return renderPlaying();
}

function playerListHTML(){
  return gameState.players.map(p => {
    const isTurn = p.user_id === gameState.game.current_turn_user_id;
    const mine = p.user_id === session.user.id;
    const regionCount = gameState.ownership.filter(o => o.owner_user_id === p.user_id).length;
    const online = isOnline(p);
    return `<div class="player ${isTurn?'turn':''}">
      <span class="swatch" style="background:${p.color}"></span>
      <div style="flex:1;min-width:0">
        <div><strong>${escapeHTML(p.username||'Oyuncu')}</strong> ${mine?'<small>(sen)</small>':''}
          <span class="online-dot ${online?'on':'off'}" title="${online?'Online':'Offline'}"></span>
        </div>
        <small>${regionCount} bölge</small>
      </div>
      ${isTurn?'<span class="badge playing">Sıra</span>':''}
    </div>`;
  }).join("");
}

function renderLobby(){
  const g = gameState.game;
  const isCreator = g.creator_id === session.user.id;
  const onlineOk = allOnline();

  $("sidePanel").innerHTML = `
    <section class="panel">
      <h2>Lobi <span class="badge lobby">bekliyor</span></h2>
      <div class="code-box" id="copyCode">${g.code}<small>Kodu arkadaşlarına gönder</small></div>
      <small>${gameState.players.length} / ${g.max_players} oyuncu</small>
      ${isCreator ? `
        <div class="toggle-plane ${g.is_public ? 'active' : ''}" id="publicToggle" style="margin-top:12px">
          <input type="checkbox" id="publicCheckbox" ${g.is_public ? 'checked' : ''}>
          <span>🌐 Sunucu listesinde göster (online)</span>
        </div>
      ` : ''}
    </section>
    <section class="panel">
      <h2>Oyunu Başlat</h2>
      ${isCreator ? `
        <div id="startError" style="color:var(--red); font-size:13px; margin-bottom:8px; font-weight:bold; white-space:pre-wrap;"></div>
        <button id="startBtn" class="success">Oyunu Başlat</button>
        ${!onlineOk ? `<small class="muted" style="display:block;margin-top:6px">⚠️ Tüm oyuncular bağlı değil (Yine de deneyebilirsin)</small>` : `<small class="muted" style="display:block;margin-top:6px">Herkes hazır olduğunda başlat.</small>`}
      ` : `<small>Kurucunun başlatması bekleniyor…</small>`}
    </section>
    <section class="panel"><h2>Oyuncular</h2><div id="players">${playerListHTML()}</div></section>
    <section class="panel" style="display:flex; gap:8px">
      <button id="leaveBtn" class="danger">Sunucudan Ayrıl</button>
      <button id="logoutBtn" class="secondary">Çıkış</button>
    </section>`;

  document.getElementById("copyCode").onclick = async () => {
    try { await navigator.clipboard.writeText(gameState.game.code); msg("Kod kopyalandı: " + gameState.game.code); }
    catch { msg("Kod: " + gameState.game.code); }
  };
  
  if (isCreator) {
    $("startBtn").onclick = async () => {
      const errEl = $("startError");
      if (errEl) errEl.textContent = "Başlatılıyor, lütfen bekle...";
      
      const { error } = await db.rpc("start_game", { p_game_id: g.id });
      
      if (error) {
        if (errEl) errEl.textContent = "HATA: " + error.message;
        alert("Oyun başlatılamadı!\n\nHata Detayı: " + error.message + "\n\nLütfen SQL'leri çalıştırdığından emin ol.");
      } else {
        await refresh();
      }
    };
    if ($("publicToggle")) {
      $("publicToggle").onclick = (e) => {
        if (e.target.tagName !== 'INPUT') e.preventDefault();
        withStatus(async () => {
          const { error } = await db.rpc("set_game_public", { p_game_id: g.id, p_public: !g.is_public });
          if (error) throw error; await refresh();
        });
      };
    }
  }
  $("leaveBtn").onclick = () => withStatus(async () => {
    if (!confirm("Lobiden ayrılmak istediğine emin misin?")) return;
    const { error } = await db.rpc("leave_game", { p_game_id: g.id });
    if (error) throw error;
    gameState = null; stopHeartbeat();
    if (channel) { db.removeChannel(channel); channel = null; }
    renderMenu();
  });
  $("logoutBtn").onclick = () => withStatus(logout);
}

// ---------- HARİTA ----------
async function loadMap(){
  $("mapStatus").textContent = "Dünya haritası yükleniyor…";
  const sources = [
    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
    "https://unpkg.com/world-atlas@2/countries-110m.json"
  ];
  let world = null, lastErr = null;
  for (const url of sources) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      world = await res.json();
      if (!world?.objects?.countries) throw new Error("Format hatası");
      break;
    } catch(e) { lastErr = e; }
  }
  if (!world) {
    $("mapStatus").textContent = "❌ Harita yüklenemedi";
    return;
  }
  try {
    const countries = topojson.feature(world, world.objects.countries).features;
    features = countries.map(f => {
        f.properties = f.properties || {};
        f.properties.region_id = String(f.id);
        f.properties.region_name = f.properties.name || "Bilinmeyen";
        return f;
    });
    $("regionCount").textContent = features.length.toLocaleString("tr-TR") + " ülke";
    drawMap(world);
    fillCountries();
    $("mapStatus").textContent = "Harita çizildi, komşuluklar hesaplanıyor...";
    setTimeout(() => { buildNeighbors(); $("mapStatus").textContent = "Harita hazır"; }, 100);
  } catch(e) {
    $("mapStatus").textContent = "❌ Harita işlenemedi";
  }
}

function regionId(f){
  const p = f.properties || {};
  return String(p.region_id || p.shapeID || p.shapeISO || "");
}

function buildNeighbors(){
  neighbors.clear();
  const vertexMap = new Map();
  const addCoords = (coords, rid) => {
    if (typeof coords[0] === 'number') {
      const key = coords[0].toFixed(2) + "," + coords[1].toFixed(2);
      let set = vertexMap.get(key); if (!set) { set = new Set(); vertexMap.set(key, set); } set.add(rid);
    } else { for (let i = 0; i < coords.length; i++) addCoords(coords[i], rid); }
  };
  for (const f of features) { const rid = regionId(f); if (rid) addCoords(f.geometry.coordinates, rid); }
  for (const rids of vertexMap.values()) {
    if (rids.size > 1) {
      const arr = Array.from(rids);
      for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          const a = arr[i], b = arr[j];
          if (!neighbors.has(a)) neighbors.set(a, new Set()); if (!neighbors.has(b)) neighbors.set(b, new Set());
          neighbors.get(a).add(b); neighbors.get(b).add(a);
        }
      }
    }
  }
}

function drawMap(world){
  const svg = d3.select("#map"); svg.selectAll("*").remove();
  mapProjection = d3.geoMercator().fitExtent([[10, 10], [950, 550]], { type: "Sphere" });
  mapPath = d3.geoPath(mapProjection);
  mapLayer = svg.append("g");

  mapLayer.selectAll("path")
    .data(features).join("path").attr("class", "region").attr("data-region-id", f => regionId(f))
    .attr("fill", f => regionColor(f)).attr("fill-opacity", f => regionOpacity(f)).attr("d", mapPath)
    .on("click", (ev, f) => onRegionClick(f))
    .append("title").text(f => f.properties.region_name || "Ülke");

  zoomBehavior = d3.zoom().scaleExtent([1, 14]).on("zoom", e => {
    mapLayer.attr("transform", e.transform);
    mapLayer.selectAll("text.siege-label")
      .attr("font-size", (6 / e.transform.k) + "px")
      .attr("stroke-width", (1.2 / e.transform.k));
  });
  svg.call(zoomBehavior);
  repaintSiegeLabels();
}

function regionColor(f){
  const id = regionId(f);
  const o = ownership.get(id);
  if (o) return o.owner_color;
  const s = sieges.get(id);
  if (s) return s.color;
  return "#26354a";
}
function regionOpacity(f){
  const id = regionId(f);
  if (ownership.has(id)) return 1;
  if (sieges.has(id)) return 0.6;
  return 1;
}

function repaintMap(){
  if (!mapLayer) return;
  mapLayer.selectAll("path.region").attr("fill", f => regionColor(f)).attr("fill-opacity", f => regionOpacity(f));
  repaintSiegeLabels();
}

function repaintSiegeLabels(){
  if (!mapLayer || !mapPath) return;
  mapLayer.selectAll("text.siege-label").remove();
  const currentK = d3.zoomTransform(d3.select("#map").node()).k || 1;
  for (const [rid, siege] of sieges) {
    const f = features.find(x => regionId(x) === rid);
    if (!f) continue;
    const [cx, cy] = mapPath.centroid(f);
    if (!isFinite(cx) || !isFinite(cy)) continue;
    mapLayer.append("text")
      .attr("class", "siege-label")
      .attr("x", cx).attr("y", cy)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "central")
      .attr("fill", "#fff")
      .attr("font-size", (6 / currentK) + "px")
      .attr("paint-order", "stroke")
      .attr("stroke", "#000")
      .attr("stroke-width", (1.2 / currentK))
      .attr("stroke-linejoin", "round")
      .attr("font-family", "system-ui, sans-serif")
      .attr("font-weight", "bold")
      .text(`${siege.points}/6`);
  }
}

function updateMapHints(){
  const phase = curPhase();
  if (phase === "war") $("mapHint").textContent = "Düşman bölgesine tıklayarak füze at. (Karşı tarafın zarı otomatik atılır)";
  else if (phase === "rolling") $("mapHint").textContent = "Tur başlangıcı. Herkesin zar atması bekleniyor...";
  else if (planeMode) $("mapHint").textContent = "✈️ Uçak modu açık — istediğin bölgeye tıkla.";
  else $("mapHint").textContent = "Kendi bölgene komşu bir bölgeye tıklayarak genişle. (Her ülke 6 puan)";
}

async function onRegionClick(f){
  if (!gameState) return;
  const phase = curPhase();
  const gid = gameState.game.id;
  const rid = regionId(f);

  if (phase === "war") {
    const w = gameState.war;
    if (!w || w.current_turn_user_id !== session.user.id) { msg("Sıra sende değil."); return; }
    if (!w.order_set) { msg("Önce savaş sıra zarını at."); return; }
    const own = ownership.get(rid);
    const enemyId = session.user.id === w.attacker_id ? w.defender_id : w.attacker_id;
    
    if (!own) { msg("Hedef bölgenin sahibi yok."); return; }
    if (own.owner_user_id !== enemyId) { msg("Sadece düşman bölgelerine saldırabilirsin."); return; }
    if (w.current_moves <= 0) { msg("Önce savaş zarı at."); return; }

    try {
      const { data, error } = await db.rpc("fire_missile", { p_war_id: w.id, p_target_region_id: rid });
      if (error) throw error;
      if (data.war_over) msg("🏆 SAVAŞ KAZANILDI! Rakibin hiç bölgesi kalmadı.");
      else if (data.conquered) msg(`💥 BÖLGE DÜŞTÜ! (Sen: ${data.attacker_roll} - O: ${data.defender_roll})`);
      else msg(`🛡️ Savunma yaptı! (Sen: ${data.attacker_roll} - O: ${data.defender_roll}). Kalan Can: ${data.new_hp}`);
      await refresh();
    } catch (e) { msg("Hata: " + e.message); }
    return;
  }

  if (phase !== "playing" || !iAmTurn() || myDiceLeft() <= 0) { msg("Hamle yapılamaz. Zar atmalı veya sıranı beklemelisin."); return; }
  if (ownership.has(rid)) { msg("Bölge zaten alınmış."); return; }

  if (!planeMode) {
    const iHaveAny = [...ownership.values()].some(o => o.owner_user_id === session.user.id);
    if (iHaveAny) {
      const adj = neighbors.get(rid) || new Set();
      const ok = [...adj].some(a => ownership.get(a)?.owner_user_id === session.user.id);
      if (!ok) { msg("Komşu değil. 'Uçak modu'nu dene."); return; }
    }
  }

  try {
    const adjArr = [...(neighbors.get(rid) || [])];
    const { data, error } = await db.rpc("claim_region_v3", { p_game_id: gid, p_region_id: rid, p_plane: planeMode, p_adjacent_ids: adjArr });
    if (error) throw error;
    if (data.round_over) msg(`✅ Tur bitti! Yeni turlar için zar atın.`);
    else if (data.conquered) msg(`✅ Bölge tamamen alındı! Kalan Hamle: ${data.remaining}`);
    else msg(`⚔️ Kuşatma başladı. ${data.moves_used} puan harcandı. Kalan Hamle: ${data.remaining}`);
    await refresh();
  } catch (e) { msg("Hata: " + e.message); }
}

$("zoomIn").onclick = () => zoomBehavior && d3.select("#map").transition().call(zoomBehavior.scaleBy, 1.4);
$("zoomOut").onclick = () => zoomBehavior && d3.select("#map").transition().call(zoomBehavior.scaleBy, 1/1.4);
$("resetZoom").onclick = () => zoomBehavior && d3.select("#map").transition().call(zoomBehavior.transform, d3.zoomIdentity);

async function withStatus(fn){
  try { await fn(); }
  catch(e) {
    msg(e.message || String(e));
    const authErr = document.getElementById("authStatus");
    if (authErr) authErr.textContent = e.message || String(e);
    console.error(e);
  }
}

async function start(){
  loadMap().then(() => {
    updateMapHints();
    if (gameState) repaintMap();
  }).catch(e => console.error("Harita yüklenemedi:", e));

  const { data } = await db.auth.getSession();
  session = data.session;
  if (session) {
    $("userState").textContent = "Giriş yapıldı";
    await afterLogin();
  } else {
    $("userState").textContent = "Oturum kapalı";
    renderAuth();
  }
}

start();
