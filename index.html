<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dünya Hâkimiyeti — Anında Harita</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#141c2e; --line:#2b3852; --text:#eef3ff; --muted:#9aa9c5; --accent:#4ade80; --danger:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at top,#17233c,var(--bg) 55%); color:var(--text); font:16px/1.5 system-ui,Segoe UI,sans-serif; min-height:100vh; overflow-x:hidden; }
    header { padding:14px clamp(16px,4vw,48px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-weight:800; font-size:clamp(18px,3vw,24px); }
    main { width:min(1350px,100%); margin:16px auto; padding:0 16px 48px; display:grid; grid-template-columns:300px 1fr; gap:16px; }
    .card { background:rgba(20,28,46,.94); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 16px 40px #0002; }
    h1,h2 { margin-top:0; line-height:1.2; } h1 { font-size:20px; } h2 { font-size:17px; }
    p { color:var(--muted); font-size:13px; }
    label { display:block; margin:8px 0 3px; color:#cbd6ed; font-size:13px; }
    input,select,button { width:100%; border-radius:8px; border:1px solid var(--line); padding:9px; font:inherit; color:var(--text); background:#0c1425; }
    button { background:var(--accent); color:#062013; border:0; font-weight:800; cursor:pointer; margin-top:8px; transition:filter .15s; }
    button:hover:not(:disabled) { filter:brightness(1.1); }
    button.secondary { background:#25334d; color:var(--text); border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .status { padding:10px; background:#0b1424; border:1px solid var(--line); border-radius:8px; margin-top:8px; font-size:12px; white-space:pre-wrap; }
    .status.ok { border-color:#286b4a; } .status.err { border-color:var(--danger); color:#fecaca; }
    
    /* HARİTA VE ZOOM */
    .map-container { background:#050b14; border:1px solid var(--line); border-radius:14px; padding:10px; position:relative; min-height:550px; overflow:hidden; cursor:grab; }
    .map-container:active { cursor:grabbing; }
    #world-map { width:100%; height:530px; display:block; background:#0b1323; border-radius:8px; }
    
    /* ÜLKE SINIRLARI */
    .country-path { fill:#1e293b; stroke:#3b4f6e; stroke-width:0.6px; transition:fill .2s, stroke .2s; cursor:pointer; }
    .country-path:hover { fill:#334155; stroke:var(--accent); stroke-width:1.2px; }
    .country-path.captured { stroke:#ffffff; stroke-width:1.2px; }

    .zoom-controls { position:absolute; top:20px; right:20px; display:flex; flex-direction:column; gap:6px; z-index:10; }
    .zoom-btn { width:36px; height:36px; padding:0; display:grid; place-items:center; font-size:18px; font-weight:bold; background:#1e293b; border:1px solid var(--line); color:var(--text); border-radius:8px; margin:0; }
    
    .dice-panel { display:flex; align-items:center; justify-content:space-between; margin-top:12px; background:#0e172a; padding:12px 16px; border-radius:12px; border:1px solid var(--line); }
    .dice-val { font-size:28px; font-weight:900; color:var(--accent); min-width:40px; text-align:center; }
    .moves-badge { background:#2563eb; color:#fff; padding:4px 10px; border-radius:6px; font-weight:bold; font-size:13px; }
    #map-loading { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:var(--accent); font-weight:bold; font-size:15px; }

    @media(max-width:900px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <div class="brand">🌍 Dünya Hâkimiyeti</div>
</header>
<main>
  <aside>
    <section class="card">
      <h1>Giriş Yap</h1>
      <div class="row">
        <div><label>E-posta</label><input id="email" type="email" placeholder="ornek@mail.com"></div>
        <div><label>Şifre</label><input id="password" type="password" placeholder="******"></div>
      </div>
      <div class="row">
        <button id="signup">Kayıt</button>
        <button id="login" class="secondary">Giriş</button>
      </div>
      <button id="logout" class="secondary" hidden>Çıkış Yap</button>
      <div id="authStatus" class="status">Giriş yapılmadı.</div>
    </section>

    <section class="card" style="margin-top:12px">
      <h2>Ülke Seçimi</h2>
      <p>İstediğin ülkeyi özgürce seçebilirsin.</p>
      <label>Oyuncu Adı</label>
      <input id="username" placeholder="Komutan">
      <label>Renk</label>
      <select id="color">
        <option value="#3b82f6">🔵 Mavi</option><option value="#ef4444">🔴 Kırmızı</option>
        <option value="#22c55e">🟢 Yeşil</option><option value="#eab308">🟡 Sarı</option><option value="#a855f7">🟣 Mor</option>
      </select>
      <label>Başlangıç Ülkesi</label>
      <select id="country"><option value="">Yükleniyor…</option></select>
      <button id="saveProfile">Seçimi Onayla</button>
      <div id="profileStatus" class="status">Henüz seçim yapılmadı.</div>
    </section>
  </aside>

  <section class="card wide">
    <div class="map-container">
      <div id="map-loading">🗺️ Harita Yükleniyor...</div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomInBtn">+</button>
        <button class="zoom-btn" id="zoomOutBtn">-</button>
        <button class="zoom-btn" id="zoomResetBtn">⟲</button>
      </div>
      <svg id="world-map" viewBox="0 0 960 500"><g id="map-group"></g></svg>
    </div>

    <div class="dice-panel">
      <div>
        <div style="font-weight:bold; display:flex; align-items:center; gap:8px">
          Fetih Mekanizması
          <span id="remainingMoves" class="moves-badge" style="display:none">Kalan Hak: 0</span>
        </div>
        <div style="font-size:12px; color:var(--muted)">Zار at ve haritadan dilediğin bölgeye tıklayarak fethet!</div>
      </div>
      <div style="display:flex; align-items:center; gap:12px">
        <div id="diceResult" class="dice-val">-</div>
        <button id="rollDiceBtn" style="margin:0; width:auto; padding:10px 18px">🎲 Zar At</button>
      </div>
    </div>

    <h2 style="margin-top:14px">Odadaki Oyuncular</h2>
    <div id="players" class="status">Oyuncu listesi yükleniyor…</div>
  </section>
</main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const $ = (id) => document.getElementById(id);
  const ROOM_ID = "11111111-1111-1111-1111-111111111111";
  let db = null, currentUser = null, channel = null;
  let remainingMoves = 0, playerColor = "#3b82f6", countryNames = {};

  const SUPABASE_URL = "https://ycnhjtgrrhgwjbyhbfmh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_lzDd7QoBsJPCr8Fw1HDXMg_hPT7I_eG";

  const svg = d3.select("#world-map");
  const mapGroup = d3.select("#map-group");
  
  const zoom = d3.zoom()
    .scaleExtent([1, 15])
    .on("zoom", (event) => {
      mapGroup.attr("transform", event.transform);
    });

  svg.call(zoom);

  $("zoomInBtn").onclick = () => svg.transition().call(zoom.scaleBy, 1.5);
  $("zoomOutBtn").onclick = () => svg.transition().call(zoom.scaleBy, 0.7);
  $("zoomResetBtn").onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity);

  // HARİTAYI GİRİŞ KOŞULUNA BAĞLAMADAN HEMEN YÜKLE
  async function renderMap() {
    const projection = d3.geoMercator().scale(150).translate([480, 300]);
    const pathGenerator = d3.geoPath().projection(projection);

    try {
      const response = await fetch("https://raw.githubusercontent.com/johan/world.geojson/master/countries.geo.json");
      if (!response.ok) throw new Error("Harita verisi alınamadı");
      
      const worldData = await response.json();
      const features = worldData.features;

      $("map-loading").style.display = "none";
      
      mapGroup.selectAll("path")
        .data(features)
        .enter()
        .append("path")
        .attr("class", "country-path")
        .attr("d", pathGenerator)
        .on("click", function(event, d) {
          if (remainingMoves <= 0) {
            alert("Önce zar atmalısın ya da bu turdaki fetih hakkın bitti!");
            return;
          }
          d3.select(this).classed("captured", true).style("fill", playerColor);
          remainingMoves--;
          updateMovesBadge();
          showStatus(`🎉 Bölge fethedildi! Kalan Hak: ${remainingMoves}`, "ok");
        });
    } catch (e) {
      $("map-loading").textContent = "Harita yüklenemedi: " + e.message;
    }
  }

  function updateMovesBadge() {
    const badge = $("remainingMoves");
    if (remainingMoves > 0) {
      badge.style.display = "inline-block";
      badge.textContent = `Kalan Fetih Hakkı: ${remainingMoves}`;
    } else {
      badge.style.display = "none";
    }
  }

  $("rollDiceBtn").addEventListener("click", () => {
    const dice = Math.floor(Math.random() * 6) + 1;
    $("diceResult").textContent = dice;
    remainingMoves = dice;
    updateMovesBadge();
    showStatus(`🎲 Zar: ${dice}! Haritadan ${dice} adet bölgeye tıklayarak fethet.`, "ok");
  });

  function showStatus(msg, kind = "") {
    const el = $("profileStatus"); el.textContent = msg; el.className = "status " + kind;
  }

  async function init() {
    // 1. Haritayı doğrudan yükle (Giriş yapmayı beklemez)
    renderMap();

    try {
      db = createClient(SUPABASE_URL, SUPABASE_KEY);
      db.auth.onAuthStateChange((_ev, session) => { currentUser = session?.user ?? null; updateAuthUi(); });
      const { data } = await db.auth.getSession();
      currentUser = data.session?.user ?? null;
      updateAuthUi();
      await loadCountries();
      if (currentUser) {
        await refreshPlayers();
        subscribe();
      }
    } catch (e) {
      console.error("Supabase init hatası:", e);
    }
  }

  function updateAuthUi() {
    $("logout").hidden = !currentUser;
    show("authStatus", currentUser ? `Giriş Yapıldı: ${currentUser.email}` : "Giriş yapılmadı.", currentUser ? "ok" : "");
  }

  async function loadCountries() {
    const { data } = await db.from("countries").select("code,name").order("name");
    if (!data) return;
    countryNames = Object.fromEntries(data.map(c => [c.code, c.name]));
    const sel = $("country");
    sel.replaceChildren(new Option("Ülke seç…", ""), ...data.map(c => new Option(c.name, c.code)));
  }

  $("signup").addEventListener("click", async () => {
    const { error } = await db.auth.signUp({ email: $("email").value, password: $("password").value });
    show("authStatus", error ? error.message : "Kayıt başarılı, giriş yapabilirsiniz.", error ? "err" : "ok");
  });

  $("login").addEventListener("click", async () => {
    const { error } = await db.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
    if (!error) {
      currentUser = (await db.auth.getSession()).data.session?.user ?? null;
      updateAuthUi();
      await refreshPlayers();
      subscribe();
    } else {
      show("authStatus", error.message, "err");
    }
  });

  $("logout").addEventListener("click", async () => { 
    await db.auth.signOut(); 
    currentUser = null;
    updateAuthUi();
    $("players").textContent = "Oyuncu listesi yükleniyor…";
  });

  $("saveProfile").addEventListener("click", async () => {
    try {
      if (!currentUser) throw new Error("Önce giriş yapmalısın.");
      playerColor = $("color").value;
      const username = $("username").value.trim();
      const country = $("country").value;
      const { error } = await db.rpc("join_game", {
        p_game_id: ROOM_ID, p_username: username, p_country: country, p_color: playerColor
      });
      if (error) throw error;
      show("profileStatus", "Ülke başarıyla kaydedildi! 🎉", "ok");
      await refreshPlayers();
    } catch (e) { show("profileStatus", e.message, "err"); }
  });

  async function refreshPlayers() {
    if (!db || !currentUser) return;
    const { data: rows } = await db.from("game_players").select("user_id,country_code,color").eq("game_id", ROOM_ID);
    if (!rows) return;
    
    const box = $("players"); box.replaceChildren();
    for (const r of rows) {
      const line = document.createElement("div");
      line.textContent = `📍 ${countryNames[r.country_code] || r.country_code} — Renk: ${r.color}`;
      box.append(line);
    }
  }

  function subscribe() {
    if (channel) return;
    channel = db.channel("room-" + ROOM_ID)
      .on("postgres_changes", { event: "*", schema: "public", table: "game_players", filter: `game_id=eq.${ROOM_ID}` }, refreshPlayers)
      .subscribe();
  }

  init();
</script>
</body>
</html>
